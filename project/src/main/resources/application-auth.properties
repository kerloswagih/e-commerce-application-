spring.application.name=auth-service
server.port=8080

# Spring Cloud Config - Disable to use local properties
spring.cloud.config.enabled=false
spring.config.import=

# Primary PostgreSQL Configuration (project_db - User Management)
spring.datasource.url=jdbc:postgresql://localhost:5432/project_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Configuration
server.servlet.context-path=/api

# Eureka Client Configuration
eureka.client.enabled=true
# Point clients to the Eureka server's registry endpoint. The Eureka server exposes
# the registry at /eureka/ (no global /api prefix), so use that path here.
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
test.property=loaded
logging.level.com.netflix.discovery=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG


# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123

# JWT Configuration
jwt.secret=my-super-secret-key-that-is-at-least-256-bits-long-for-HS256-algorithm-jwt-secret
jwt.expiration=86400000
