server.port=8888
spring.application.name=config-server

# Use ONLY native (file-based) configuration mode with local config-repo directory
spring.cloud.config.server.native.search-locations=file:./config-repo

# Disable Git Repository
spring.cloud.config.server.git.enabled=true
spring.cloud.config.server.git.uri=file:///${user.dir}/dummy-git-repo

# Exclude problematic auto-configurations:
# - EurekaServerAutoConfiguration: Config Server doesn't need Eureka Server
# - SimpleDiscoveryClientAutoConfiguration: Not needed
# - DefaultRepositoryConfiguration: Creates default git repo which we don't want
# - ConfigServerActuatorConfiguration: Health indicator that checks git config
spring.autoconfigure.exclude=org.springframework.cloud.netflix.eureka.server.EurekaServerAutoConfiguration,org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration

# Disable Eureka and Discovery
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false

# Disable JPA/database features for config-server profile
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.maximum-pool-size=1

# No actuator endpoints since health checks fail without git config
management.endpoints.web.exposure.include=none


