# Note: spring.application.name is set in profile-specific files (application-auth.properties, application-inventory.properties, etc.)
# To run a specific microservice, set SPRING_PROFILES_ACTIVE environment variable before running:
# $env:SPRING_PROFILES_ACTIVE = "auth"  (or "inventory", "wallet", "shop", "eureka-server")
spring.application.name=default-service

# Spring Cloud Config - Enable to use remote properties
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.fail-fast=false

# Primary PostgreSQL Configuration (project_db - User Management)
spring.datasource.url=jdbc:postgresql://localhost:5432/project_db
spring.datasource.username=project_user
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration (limit to prevent exhausting PostgreSQL)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Configuration
# Default server port for services. Do NOT set a global context-path here because
# it unintentionally prefixes all services (gateway, Eureka, config server, etc.)
# and causes mismatches between advertised Eureka URLs and actual endpoints.
server.port=8080

spring.config.activate.on-profile=!gateway

# Eureka Client Configuration
eureka.client.enabled=true
# Eureka server is hosted at http://localhost:8761 and exposes the registry at /eureka/
# Keep the defaultZone consistent with the actual Eureka server path (no global /api prefix).
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30


# JWT Configuration
jwt.secret=my-super-secret-key-that-is-at-least-256-bits-long-for-HS256-algorithm-jwt-secret
jwt.expiration=86400000

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.userServiceClient.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.userServiceClient.slidingWindowSize=5
resilience4j.circuitbreaker.instances.userServiceClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userServiceClient.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.userServiceClient.slowCallDurationThreshold=1000
resilience4j.circuitbreaker.instances.userServiceClient.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.userServiceClient.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.userServiceClient.waitDurationInOpenState=10000

resilience4j.circuitbreaker.instances.inventoryServiceClient.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.inventoryServiceClient.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventoryServiceClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventoryServiceClient.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.inventoryServiceClient.slowCallDurationThreshold=1000
resilience4j.circuitbreaker.instances.inventoryServiceClient.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventoryServiceClient.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.inventoryServiceClient.waitDurationInOpenState=10000

resilience4j.circuitbreaker.instances.walletServiceClient.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.walletServiceClient.slidingWindowSize=5
resilience4j.circuitbreaker.instances.walletServiceClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.walletServiceClient.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.walletServiceClient.slowCallDurationThreshold=1000
resilience4j.circuitbreaker.instances.walletServiceClient.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.walletServiceClient.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.walletServiceClient.waitDurationInOpenState=10000

# Actuator Endpoints - Enable all for monitoring
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreaker-events,prometheus
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.metrics.export.prometheus.enabled=true

# Resilience4j Logging
logging.level.io.github.resilience4j=DEBUG

