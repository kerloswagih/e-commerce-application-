server.port=8084
spring.application.name=gateway

# Spring Cloud Gateway Configuration
# Disable dynamic discovery locator to use explicit routes defined below
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Gateway Route Timeout Configuration (in milliseconds)
spring.cloud.gateway.routes[*].timeout=30000
spring.cloud.gateway.httpclient.connect-timeout=10000
spring.cloud.gateway.httpclient.response-timeout=30000

# Load Balancer Configuration
spring.cloud.loadbalancer.ribbon.enabled=false
spring.cloud.loadbalancer.cache.ttl=35s
spring.cloud.loadbalancer.health-check.interval.millis=30000

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,gateway,routes
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG

# Disable database auto-configuration for gateway
spring.datasource.hikari.initialization-fail-timeout=-1

# ============================================================================
# ROUTES ARE NOW DEFINED AS JAVA BEANS IN GatewayRoutesConfig.java
# ============================================================================
# DO NOT use spring.cloud.gateway.routes[n].* properties here
# Spring Cloud Gateway Server MVC (servlet-based) does NOT support properties-driven routes
# Instead, routes are defined as @Bean RouterFunction<ServerResponse> in GatewayRoutesConfig
#
# Registered routes (see GatewayRoutesConfig.java):
# - auth-health-route:   /api/auth/health → lb://auth-service:/api/actuator/health
# - shop-route:          /api/shop/**     → lb://shop-service:/api/v1/shop/**
# - auth-route:          /api/auth/**     → lb://auth-service:/api/v1/auth/**
# - wallet-route:        /api/wallet/**   → lb://wallet-service:/api/v1/wallet/**
# - inventory-route:     /api/inventory/**→ lb://inventory-service:/api/v1/inventory/**
# - user-route:          /api/users/**    → lb://auth-service:/api/v1/users/**
# - transaction-route:   /api/transactions/** → lb://wallet-service:/api/v1/transactions/**
# - eureka-route:        /eureka/**       → lb://eureka-server:/eureka/**
