server.port=8084
spring.application.name=gateway

# Enable discovery-based routing
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Forward to services using load-balanced serviceId (Eureka)
spring.cloud.gateway.routes[0].id=shop-route
spring.cloud.gateway.routes[0].uri=lb://shop-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/shop/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/shop/(?<segment>.*),/api/v1/shop/${segment}

spring.cloud.gateway.routes[1].id=auth-route
spring.cloud.gateway.routes[1].uri=lb://auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/auth/(?<segment>.*),/api/v1/auth/${segment}

spring.cloud.gateway.routes[2].id=wallet-route
spring.cloud.gateway.routes[2].uri=lb://wallet-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/wallet/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/wallet/(?<segment>.*),/api/v1/wallet/${segment}

spring.cloud.gateway.routes[3].id=inventory-route
spring.cloud.gateway.routes[3].uri=lb://inventory-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/inventory/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/inventory/(?<segment>.*),/api/v1/inventory/${segment}

spring.cloud.gateway.routes[4].id=eureka-route
spring.cloud.gateway.routes[4].uri=lb://eureka-server
spring.cloud.gateway.routes[4].predicates[0]=Path=/eureka/**


