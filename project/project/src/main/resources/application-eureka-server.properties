spring.application.name=eureka-server
server.port=8761

# Disable Config Client for Eureka Server
spring.cloud.config.enabled=false

# Eureka Server Configuration
# Don't register the Eureka server with itself
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Server Behavior
# Disable self-preservation mode for testing (in production, keep it enabled)
eureka.server.enable-self-preservation=false
# How often Eureka server evicts instances with expired leases (in milliseconds)
eureka.server.eviction-interval-timer-in-ms=30000

# Instance Configuration
eureka.instance.prefer-ip-address=true

# Actuator Configuration - Expose all endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Server Context Path (Eureka server UI is accessible at /)
server.servlet.context-path=

# Logging
logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO
