# Default Configuration - Use this when running without a specific profile
# To run a specific microservice, set SPRING_PROFILES_ACTIVE environment variable:
#
# For Auth Service:
#   $env:SPRING_PROFILES_ACTIVE = "auth"
#   .\mvnw.cmd spring-boot:run
#
# For Inventory Service:
#   $env:SPRING_PROFILES_ACTIVE = "inventory"
#   .\mvnw.cmd spring-boot:run
#
# For Wallet Service:
#   $env:SPRING_PROFILES_ACTIVE = "wallet"
#   .\mvnw.cmd spring-boot:run
#
# For Shop Service:
#   $env:SPRING_PROFILES_ACTIVE = "shop"
#   .\mvnw.cmd spring-boot:run
#
# For Eureka Server:
#   $env:SPRING_PROFILES_ACTIVE = "eureka-server"
#   .\mvnw.cmd spring-boot:run

spring.application.name=default-service
server.port=8080

# Spring Cloud Config - Disable to use local properties
spring.cloud.config.enabled=false
spring.config.import=

# Primary PostgreSQL Configuration (project_db - User Management)
spring.datasource.url=jdbc:postgresql://localhost:5432/project_db
spring.datasource.username=project_user
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Wallet Microservice Database (wallet_db)
spring.datasource.wallet.url=jdbc:postgresql://localhost:5432/wallet_db
spring.datasource.wallet.username=project_user
spring.datasource.wallet.password=1234
spring.datasource.wallet.driver-class-name=org.postgresql.Driver

# Inventory Microservice Database (inventory_db)
spring.datasource.inventory.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.inventory.username=project_user
spring.datasource.inventory.password=1234
spring.datasource.inventory.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration

# Eureka Client Configuration
eureka.client.enabled=true
# Point clients to the Eureka server's registry endpoint. Use /eureka/ (no global /api prefix)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Feign Client Configuration
feign.auth-service.url=http://auth-service:8080
feign.wallet-service.url=http://wallet-service:8081
feign.inventory-service.url=http://inventory-service:8082
feign.shop-service.url=http://shop-service:8083

# Feign Hystrix/Resilience4j Configuration
feign.hystrix.enabled=true
resilience4j.circuitbreaker.instances.userServiceClient.slidingWindowSize=5
resilience4j.circuitbreaker.instances.userServiceClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventoryServiceClient.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventoryServiceClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.walletServiceClient.slidingWindowSize=5
resilience4j.circuitbreaker.instances.walletServiceClient.failureRateThreshold=50

# Security disabled for testing (comment out to disable login)
# spring.security.user.name=admin
# spring.security.user.password=admin123

# JWT Configuration
jwt.secret=my-super-secret-key-that-is-at-least-256-bits-long-for-HS256-algorithm-jwt-secret
jwt.expiration=86400000

