spring.application.name=wallet-service
server.port=8081

# Wallet Microservice Database (wallet_db)
spring.datasource.url=jdbc:postgresql://localhost:5432/wallet_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Configuration
server.servlet.context-path=/api

# Eureka Client Configuration
eureka.client.enabled=true
# Point clients to the Eureka server's registry endpoint. Use /eureka/ (no global /api prefix)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30


# Eureka Health Check Configuration
eureka.instance.health-check-url-path=/api/actuator/health
eureka.instance.status-page-url-path=/api/actuator/info

# Feign Client Configuration - Uses Eureka Service Discovery
# No hardcoded URLs - Feign will use load balancer (lb://service-name)

# Feign Logging Configuration - ENABLE DEBUG LOGS FOR FEIGN CLIENTS
logging.level.root=INFO
logging.level.com.example.project=DEBUG
logging.level.com.example.project.feign=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123

# JWT Configuration
jwt.secret=my-super-secret-key-that-is-at-least-256-bits-long-for-HS256-algorithm-jwt-secret
jwt.expiration=86400000

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics,actuator
management.endpoint.health.show-details=always
